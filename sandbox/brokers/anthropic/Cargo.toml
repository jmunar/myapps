# Deliberately its own workspace: the broker runs on the host, never on the
# Odroid, and `make check` must stay exactly what CI runs.
[workspace]

[package]
name = "msb-broker-anthropic"
version = "0.1.0"
edition = "2024"
description = "Host-side credential broker: the only process that sees the Anthropic token"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"

[profile.release]
opt-level = "s"
strip = true
