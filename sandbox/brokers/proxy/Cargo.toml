# Deliberately its own workspace, like the other two brokers: these run on the
# host, never on the Odroid, and `make check` must stay exactly what CI runs.
[workspace]

[package]
name = "devbox-broker-proxy"
version = "0.1.0"
edition = "2024"
description = "Host-side egress proxy: the sandbox's only way out, and it only goes where the capabilities say"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "time"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = "0.4"
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
