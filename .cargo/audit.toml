[advisories]
ignore = [
    # Marvin Attack on `rsa` crate — transitive dep via web-push -> jwt-simple -> superboring.
    # No patch available. Low practical risk: only used for VAPID JWT signing, not key exchange.
    "RUSTSEC-2023-0071",
    # `smallstr` is unmaintained. Transitive dep via yrs (Notes CRDT); unmaintained only,
    # no vulnerability. No action possible until yrs drops it.
    "RUSTSEC-2026-0215",
    # Timing variability in crypto-bigint 0.5.5, reached via web-push -> jwt-simple 0.12
    # -> elliptic-curve 0.13. The fix needs crypto-bigint >=0.7.6, which needs
    # jwt-simple 0.13; no released web-push accepts that yet. Low practical risk: only
    # VAPID ES256 signing with our own push key uses it, not an attacker-facing signing
    # oracle. Remove this ignore once web-push bumps jwt-simple.
    "RUSTSEC-2026-0387",
    # SQLite <3.54 (CVE-2026-119375) bundled by libsqlite3-sys 0.30.1, via sqlx-sqlite.
    # The fix needs libsqlite3-sys >=0.39, but the newest released sqlx (0.9.0) caps it
    # below 0.38; only unreleased sqlx main allows <0.40. The bug needs a database file
    # and a sibling -wal written by a less trusted party; MyApps only opens its own
    # DATABASE_URL, never a user-supplied SQLite file. Remove this ignore, and bump
    # sqlx and the direct libsqlite3-sys dep in myapps-core, once a sqlx release allows 0.39.
    "RUSTSEC-2026-0459",
]
